kind = "web"
previewPath = "/"
title = "Study Together London"
description = "A clickable prototype for students at London's five Russell Group universities to find welcoming study spaces, connect with peers, join small study groups, and post drop-in sessions."
version = "1.0.0"
id = "artifacts/london-study"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23955

[services.development]
run = "pnpm --filter @workspace/london-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/london-study", "run", "build" ]
serve = "static"
publicDir = "artifacts/london-study/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23955"
BASE_PATH = "/"
